name: apk

on:
  push:
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      # THE PROJECT IS AT THE REPO ROOT, not under android/. The old
      # workflow carried paths from the previous repo layout and gradle
      # said so plainly: "Project directory .../android is not part of
      # the build defined by settings file .../settings.gradle.kts".
      - name: stage the stores
        run: |
          mkdir -p app/src/main/assets

          # REQUIRED. The language is genome and the grammar is a
          # holding — without either the app installs and refuses to
          # boot, which is correct behaviour and a wasted download.
          missing=0
          for f in words.blob words.by_word words.by_id \
                   table3.btb table3.btb.idx grammar.tsv; do
            if [ -f "$f" ]; then cp "$f" app/src/main/assets/
            else echo "MISSING REQUIRED: $f"; missing=1; fi
          done

          # OPTIONAL. An archive is somebody's life, and a core without
          # one has simply NOT LIVED YET — the normal state of a new
          # entity rather than a build failure.
          for f in seth_el.raw seth_el.raw.u64 \
                   seth_el.post seth_el.post.idx; do
            if [ -f "$f" ]; then cp "$f" app/src/main/assets/
            else echo "no archive: $f (fine)"; fi
          done

          ls -la app/src/main/assets/
          if [ "$missing" = "1" ]; then
            echo "::error::a required store is not in the repo"
            exit 1
          fi

      - name: build
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vex-attempt-apk
          path: app/build/outputs/apk/release/*.apk

      - name: release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vex-attempt-v${{ github.run_number }}
          name: VexAttempt build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
